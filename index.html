<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>The P&amp;J Wedding Shenanigans</title>
  <meta name="description" content="Shared wedding expenses for the P&J families — who paid, who owes, all square." />
  <meta name="theme-color" content="#FBF5EC" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="P&amp;J" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Sign-in gate (cloud mode) -->
  <section id="gate" class="gate" hidden>
    <div class="gate-card">
      <div class="monogram">P<span>&amp;</span>J</div>
      <h1>The P&amp;J Wedding<br /><em>Shenanigans</em></h1>
      <p id="gate-msg">One shared ledger for both families. Sign in to start.</p>
      <button class="btn btn-primary btn-lg" data-action="sign-in">Continue with Google</button>
      <button class="btn btn-ghost" data-action="sign-out" id="gate-out" hidden>Use a different account</button>
    </div>
  </section>

  <div id="app" class="app" hidden>
    <header class="top">
      <div class="brand">
        <div class="monogram sm">P<span>&amp;</span>J</div>
        <div>
          <p class="eyebrow">The P&amp;J Wedding</p>
          <h1 class="title">Shenanigans</h1>
        </div>
      </div>
      <span id="mode-pill" class="pill"></span>
    </header>

    <main id="view" class="view"></main>

    <nav class="nav" aria-label="Main">
      <button data-view="overview" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
      <button data-view="expenses" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg><span>Expenses</span></button>
      <button data-action="add-exp" class="nav-fab" aria-label="Add expense"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button data-view="settle" class="nav-btn"><svg viewBox="0 0 24 24"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg><span>Settle</span></button>
      <button data-view="more" class="nav-btn"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.8c1.7.8 2.7 2.6 3 5.2"/></svg><span>Family</span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
